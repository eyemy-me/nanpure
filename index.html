<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ナンプレ 観測版 v5.8</title>
<style>

:root{
  color-scheme: light;
  --viz-text:#1f2937;
  --viz-muted:#6b7280;
  --viz-border:#cbd5e1;
  --viz-panel:#ffffff;
  --viz-card:#f8fafc;
  --viz-accent:#2563eb;
  --viz-accent-bg:#dbeafe;
  --viz-series-2:#dc2626;
  --viz-series-3:#7c3aed;
  --viz-peer-bg:#eef2f7;
  --viz-same-bg:#cfe8ff;
  --viz-selected-bg:#bcdcff;
}

html[data-theme="dark"]{
  color-scheme:dark;
  --viz-text:#e5e7eb;
  --viz-muted:#9ca3af;
  --viz-border:#475569;
  --viz-panel:#111827;
  --viz-card:#1f2937;
  --viz-accent:#60a5fa;
  --viz-accent-bg:#1e3a5f;
  --viz-series-2:#f87171;
  --viz-series-3:#c084fc;
  --viz-peer-bg:#182335;
  --viz-same-bg:#234a67;
  --viz-selected-bg:#1d4f7a;
}
html[data-theme="dark"] body{background:#080f1c}
html[data-theme="dark"] #np-observer-game{box-shadow:0 8px 28px rgba(0,0,0,.34)}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef2f7;color:var(--viz-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}
body{min-height:100vh;padding:16px;transition:background .18s ease,color .18s ease}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
.hidden{display:none!important}

#np-observer-game{
  width:100%;
  max-width:900px;
  min-width:0;
  margin:0 auto;
  padding:16px;
  border:1px solid var(--viz-border);
  border-radius:16px;
  background:var(--viz-panel);
  box-shadow:0 8px 28px rgba(15,23,42,.08);
}
#np-observer-game > section:first-child{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  gap:8px;
  margin-bottom:12px;
}
#np-observer-game > section:first-child label{
  min-width:116px;
  font-size:14px;
  font-weight:600;
}
#np-observer-game select{
  display:block;
  width:100%;
  margin-top:4px;
  padding:7px 10px;
  border:1px solid var(--viz-border);
  border-radius:9px;
  background:var(--viz-panel);
  font-size:16px;
}
#np-observer-game > section:first-child button,
#no-check,#no-hint,#no-reset,#no-save,#no-load,#no-copy-one,#no-copy-all,#no-volume,
#no-note,#no-undo{
  min-height:36px;
  border:1px solid var(--viz-border);
  border-radius:9px;
  background:var(--viz-panel);
  padding:7px 11px;
}
#no-new,#no-guard{background:var(--viz-accent-bg)!important}
#np-observer-game > section:first-child > div:last-child{
  margin-left:auto;
  font-size:14px;
  color:var(--viz-muted);
}

#no-status{
  margin-bottom:12px;
  padding:9px 12px;
  border:1px solid var(--viz-border);
  border-radius:9px;
  background:var(--viz-card);
  font-size:14px;
  line-height:1.45;
}

#no-result{
  margin-bottom:16px;
  padding:16px;
  border:1px solid var(--viz-border);
  border-radius:13px;
  background:var(--viz-card);
}
#no-result > div:first-child{text-align:center}
#no-result > div:first-child > div:first-child{
  font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--viz-muted)
}
#no-result-time{margin-top:4px;font-size:24px;font-weight:800}
#no-result-kicker{margin-top:14px;font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--viz-muted)}
#no-title{margin-top:3px;font-size:clamp(27px,7vw,38px);font-weight:950;line-height:1.08;letter-spacing:.01em}
#no-title-desc{max-width:610px;margin:7px auto 0;font-size:13px;line-height:1.65;color:var(--viz-muted)}
#no-secondary-wrap{max-width:610px;margin:14px auto 0;padding:10px 12px;border-top:3px double var(--viz-text);border-bottom:1px solid var(--viz-border)}
#no-secondary-label{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--viz-muted)}
#no-secondary-title{margin-top:3px;font-size:18px;font-weight:850;line-height:1.3}
#no-secondary-desc{margin-top:3px;font-size:12px;line-height:1.55;color:var(--viz-muted)}
#no-news-fact{max-width:610px;margin:12px auto 0;padding:11px 0 2px;border-top:1px solid var(--viz-text);font-size:15px;font-weight:800;line-height:1.7;text-align:left}
#no-reporter-eye{max-width:610px;margin:10px auto 0;padding:10px 12px;border-left:3px solid var(--viz-border);text-align:left;background:var(--viz-panel)}
#no-reporter-eye-label{font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--viz-muted)}
#no-editor-comment{margin-top:4px;font-family:ui-serif,"Yu Mincho","Hiragino Mincho ProN",serif;font-size:12.5px;line-height:1.8;color:var(--viz-text)}
#no-reporter-byline{margin-top:5px;font-size:10px;font-weight:700;color:var(--viz-muted);text-align:right}
#no-stats{
  max-width:680px;
  margin:16px auto 0;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  column-gap:16px;
  row-gap:8px;
  padding:12px;
  border:1px solid var(--viz-border);
  border-radius:9px;
  background:var(--viz-panel);
}
#no-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
#no-result > div:last-child{
  max-width:680px;
  margin:16px auto 0;
  padding-top:12px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  border-top:1px solid var(--viz-border);
}
#no-log-count{align-self:center;font-size:12px;color:var(--viz-muted)}

#no-game{
  display:grid;
  grid-template-columns:minmax(0,1fr) 220px;
  gap:16px;
  align-items:start;
}
#no-game[hidden]{display:none!important}
#no-game > div:first-child{min-width:0}
#no-board{
  display:grid;
  grid-template-columns:repeat(9,minmax(0,1fr));
  aspect-ratio:1/1;
  width:100%;
  max-width:560px;
  margin:0 auto;
  overflow:hidden;
  border:2px solid var(--viz-text);
  border-radius:9px;
  background:var(--viz-panel);
}
#no-board + p{
  max-width:560px;
  margin:8px auto 0;
  font-size:12px;
  line-height:1.55;
  color:var(--viz-muted);
}
#no-game aside{
  width:100%;
  max-width:290px;
  min-width:0;
  margin:0 auto;
}
#no-note,#no-undo{width:100%}
#no-note{margin-bottom:10px;min-height:40px;font-weight:700}
#no-undo{margin-top:10px}
#no-game aside > div[aria-label="数字入力"]{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
#no-game aside > div:nth-of-type(2){
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-top:12px;
}
#no-game aside > div:nth-of-type(3){
  margin-top:20px;
  padding-top:12px;
  border-top:1px solid var(--viz-border);
}
#no-game aside > div:nth-of-type(3) > div{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
#no-check,#no-hint{font-size:14px;font-weight:600}
#no-reset,#no-save,#no-load,#no-copy-one,#no-copy-all{font-size:12px;font-weight:600}

@media (max-width:720px){
  body{padding:8px}
  #np-observer-game{padding:10px;border-radius:12px}
  #no-game{grid-template-columns:1fr}
  #no-game aside{max-width:360px}
  #no-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  #np-observer-game > section:first-child > div:last-child{width:100%;margin-left:0}
}

</style>
</head>
<body>
<div id="np-observer-game" class="w-full min-w-0 text-[var(--viz-text)]">
  <section class="mb-3 flex flex-wrap items-end gap-2">
    <label class="min-w-[116px] text-sm font-medium">難易度
      <select id="no-level" class="mt-1 block w-full rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-2.5 py-1.5 text-base">
        <option value="easy">かんたん</option>
        <option value="normal" selected>ふつう</option>
        <option value="hard">むずかしい</option>
      </select>
    </label>
    <button id="no-guard" type="button" aria-pressed="true" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-accent-bg)] px-3 py-1.5 text-sm font-medium">連鎖ガード：ON</button>
    <button id="no-candidates-toggle" type="button" aria-pressed="false" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-3 py-1.5 text-sm font-medium">候補表示：OFF</button>
    <button id="no-volume" type="button" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-3 py-1.5 text-sm font-medium" aria-label="効果音の音量">効果音：中</button>
    <button id="no-dark" type="button" aria-pressed="false" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-3 py-1.5 text-sm font-medium">ダークモード：OFF</button>
    <button id="no-new" type="button" class="min-h-9 rounded-lg bg-[var(--viz-accent-bg)] px-3 py-1.5 text-sm font-medium">新しい問題</button>
    <div class="ml-auto text-sm text-[var(--viz-muted)]"><span id="no-timer">00:00</span> ・ <span id="no-clues">準備中</span></div>
  </section>

  <div id="no-status" class="mb-3 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-card)] px-3 py-2 text-sm" aria-live="polite">問題を作成しています…</div>

  <section id="no-result" class="mb-4 hidden rounded-xl border border-[var(--viz-border)] bg-[var(--viz-card)] p-4" aria-live="polite">
    <div class="text-center">
      <div class="text-xs font-semibold tracking-widest text-[var(--viz-muted)]">CLEAR!</div>
      <div id="no-result-time" class="mt-1 text-2xl font-bold">00:00</div>
      <div id="no-result-kicker">盤面スポーツ・号外</div>
      <div id="no-title">盤面解放者</div>
      <p id="no-title-desc"></p>
      <div id="no-secondary-wrap">
        <div id="no-secondary-label">副称号 / 小見出し</div>
        <div id="no-secondary-title">数字の旅人</div>
        <div id="no-secondary-desc"></div>
      </div>
      <div id="no-news-fact"></div>
      <div id="no-reporter-eye">
        <div id="no-reporter-eye-label">記者の目</div>
        <div id="no-editor-comment"></div>
        <div id="no-reporter-byline"></div>
      </div>
    </div>
    <div id="no-stats" class="mx-auto mt-4 grid max-w-[680px] grid-cols-2 gap-x-4 gap-y-2 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] p-3 text-sm sm:grid-cols-4"></div>
    <div id="no-badges" class="mt-3 flex flex-wrap justify-center gap-2"></div>
    <div class="mx-auto mt-4 flex max-w-[680px] flex-wrap justify-center gap-2 border-t border-[var(--viz-border)] pt-3">
      <button id="no-copy-one" type="button" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-3 py-1.5 text-xs font-medium">今回の記録をコピー</button>
      <button id="no-copy-all" type="button" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-3 py-1.5 text-xs font-medium">累計ログ（整理版）をコピー</button>
      <span id="no-log-count" class="self-center text-xs text-[var(--viz-muted)]">保存ログ 0局</span>
    </div>
  </section>

  <div id="no-game" class="grid gap-4 md:grid-cols-[minmax(0,1fr)_220px] md:items-start" hidden>
    <div class="min-w-0">
      <div id="no-board" class="mx-auto grid aspect-square w-full max-w-[560px] grid-cols-9 overflow-hidden rounded-lg border-2 border-[var(--viz-text)] bg-[var(--viz-panel)]" role="grid" aria-label="ナンバープレイス盤面"></div>
      <p class="mx-auto mt-2 max-w-[560px] text-xs leading-5 text-[var(--viz-muted)]">上段の「候補表示」で自動候補をON/OFFできます。OFFでも自分で触ったメモ候補は表示。自動確定はマスと数字が黄色く光って「シャッ」。</p>
    </div>

    <aside class="mx-auto w-full max-w-[290px] min-w-0 md:max-w-none">
      <button id="no-note" type="button" aria-pressed="false" class="mb-2.5 min-h-10 w-full rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-3 py-1.5 text-sm font-semibold">メモ入力：OFF</button>
      <div class="grid grid-cols-3 gap-2.5" aria-label="数字入力">
        <button type="button" data-num="1" class="no-key">1</button><button type="button" data-num="2" class="no-key">2</button><button type="button" data-num="3" class="no-key">3</button>
        <button type="button" data-num="4" class="no-key">4</button><button type="button" data-num="5" class="no-key">5</button><button type="button" data-num="6" class="no-key">6</button>
        <button type="button" data-num="7" class="no-key">7</button><button type="button" data-num="8" class="no-key">8</button><button type="button" data-num="9" class="no-key">9</button>
      </div>
      <button id="no-undo" type="button" class="mt-2.5 min-h-9 w-full rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-3 py-1.5 text-sm">一手戻す</button>
      <div class="mt-3 grid grid-cols-2 gap-2 md:grid-cols-1">
        <button id="no-check" type="button" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-2.5 py-1.5 text-sm font-medium">答え合わせ</button>
        <button id="no-hint" type="button" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-2.5 py-1.5 text-sm font-medium">ヒント（残り3）</button>
      </div>
      <div class="mt-5 border-t border-[var(--viz-border)] pt-3">
        <div class="grid grid-cols-3 gap-2">
          <button id="no-reset" type="button" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-2 py-1.5 text-xs font-medium">リセット</button>
          <button id="no-save" type="button" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-2 py-1.5 text-xs font-medium">セーブ</button>
          <button id="no-load" type="button" class="min-h-9 rounded-lg border border-[var(--viz-border)] bg-[var(--viz-panel)] px-2 py-1.5 text-xs font-medium">ロード</button>
        </div>
      </div>
    </aside>
  </div>

  <style>
    #np-observer-game .no-cell{min-width:0;aspect-ratio:1/1;border:0;border-right:1px solid var(--viz-border);border-bottom:1px solid var(--viz-border);background:transparent;font-size:clamp(16px,5vw,26px);font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;outline:none;padding:0;position:relative;isolation:isolate;overflow:hidden}
    #np-observer-game .no-cell:nth-child(9n){border-right:0}#np-observer-game .no-cell.box-r{border-right:2px solid var(--viz-text)}#np-observer-game .no-cell.box-b{border-bottom:2px solid var(--viz-text)}
    #np-observer-game .no-cell.given{font-weight:800}#np-observer-game .no-cell.auto{font-weight:700}
    /* v5.5 selection support: quiet at rest, row/column on tap, same confirmed numbers in a distinct color. */
    #np-observer-game .no-cell.peer{background:var(--viz-peer-bg)}
    #np-observer-game .no-cell.same{background:var(--viz-same-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--viz-accent) 38%,transparent)}
    #np-observer-game .no-cell.selected{background:var(--viz-selected-bg);box-shadow:inset 0 0 0 2px var(--viz-accent)}
    #np-observer-game .no-cell.hint-target{outline:3px solid var(--viz-accent);outline-offset:-4px}
    #np-observer-game .no-hint-ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,38px);font-weight:850;color:var(--viz-accent);opacity:.5;text-shadow:0 0 10px color-mix(in srgb,var(--viz-accent) 35%,transparent);pointer-events:none;animation:no-hint-float 1.2s ease-in-out infinite alternate}
    #np-observer-game .no-value{position:relative;z-index:2;display:inline-block}
    #np-observer-game .no-cell.number-glow .no-value{animation:no-number-glow .28s ease-out both}
    #np-observer-game .no-cell.wrong{color:var(--viz-series-2);text-decoration:underline;text-decoration-thickness:2px}
    #np-observer-game .no-cell.flash::after{content:'';position:absolute;inset:1px;z-index:-1;background:color-mix(in srgb,var(--viz-accent) 34%,white 66%);animation:no-flash .18s ease-out forwards}
    #np-observer-game .no-cell.confirm-flash::after{content:'';position:absolute;inset:0;z-index:-1;background:#ffd84d;animation:no-confirm .18s ease-out forwards}
    #np-observer-game .no-candidates{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:94%;height:94%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:clamp(9px,2.3vw,14px);font-weight:750;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;line-height:1;color:var(--viz-muted);pointer-events:none}
    #np-observer-game .no-candidate{display:flex;align-items:center;justify-content:center;transform-origin:center;position:relative;z-index:1}#np-observer-game .no-candidate.vanish{animation:no-pop .12s ease-in forwards}
    #np-observer-game .no-key{min-height:54px;border-radius:.7rem;border:1px solid var(--viz-border);background:var(--viz-card);font-size:1.45rem;font-weight:750;transition:opacity .15s ease,transform .06s ease}#np-observer-game .no-key:active{transform:scale(.96)}#np-observer-game .no-key.done{opacity:.25}
    #np-observer-game #no-note[aria-pressed="true"],#np-observer-game #no-guard[aria-pressed="true"],#np-observer-game #no-candidates-toggle[aria-pressed="true"],#np-observer-game #no-dark[aria-pressed="true"]{background:var(--viz-accent-bg);box-shadow:inset 0 0 0 2px var(--viz-accent)}
    #np-observer-game button:disabled{opacity:.42}
    #np-observer-game .stat-label{display:block;font-size:11px;color:var(--viz-muted)}#np-observer-game .stat-value{display:block;margin-top:1px;font-weight:800;font-size:15px}
    #np-observer-game .badge{border:1px solid var(--viz-border);border-radius:999px;background:var(--viz-panel);padding:4px 9px;font-size:11px;font-weight:650}
    @keyframes no-pop{0%{opacity:1;transform:scale(1)}55%{opacity:.95;transform:scale(1.4)}100%{opacity:0;transform:scale(.05)}}
    @keyframes no-flash{0%{opacity:0;transform:scale(.86)}30%{opacity:1}100%{opacity:0;transform:scale(1)}}
    @keyframes no-confirm{0%{opacity:0;transform:scale(.78)}25%{opacity:1;transform:scale(1)}68%{opacity:.9}100%{opacity:0;transform:scale(1.04)}}
    @keyframes no-number-glow{0%{transform:scale(.72);color:#fff7b0;text-shadow:0 0 3px #fff,0 0 9px #ffd84d,0 0 18px #ffd84d;filter:brightness(1.7)}38%{transform:scale(1.2);color:#fff4a3;text-shadow:0 0 5px #fff,0 0 12px #ffd84d,0 0 22px #ffd84d;filter:brightness(1.9)}100%{transform:scale(1);color:inherit;text-shadow:none;filter:brightness(1)}}
    @keyframes no-hint-float{from{transform:translateY(1px) scale(.98);opacity:.4}to{transform:translateY(-2px) scale(1.04);opacity:.62}}
  </style>

  <script>
  (()=>{
    const root=document.getElementById('np-observer-game');if(!root||root.dataset.ready==='1')return;root.dataset.ready='1';
